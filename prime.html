<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>質數合數切切樂 - Prime Slice</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: #2b1704;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #5c3818 0%, #2b1704 100%);
      box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      font-weight: 900;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 5;
    }
    .score-board {
      font-size: 26px;
      color: #ffca28;
    }
    .timer-board {
      font-size: 34px;
      color: #76ff03;
    }
    .lives-board {
      font-size: 26px;
      color: #ff5252;
      letter-spacing: 4px;
    }
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    .modal-card {
      background: #fff8e1;
      border: 5px solid #ffb300;
      border-radius: 20px;
      padding: 24px 28px;
      width: 90%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-card h2 {
      font-size: 26px;
      color: #d84315;
      margin-bottom: 12px;
    }
    .rules-list {
      text-align: left;
      font-size: 15px;
      color: #3e2723;
      line-height: 1.6;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.7);
      padding: 12px 16px;
      border-radius: 12px;
    }
    .rules-list li {
      margin-bottom: 6px;
    }
    .mode-select-title {
      font-size: 18px;
      font-weight: bold;
      color: #5d4037;
      margin-bottom: 12px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .start-btn {
      background: linear-gradient(180deg, #ff9800, #e65100);
      color: white;
      border: none;
      font-size: 18px;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0 #bf360c;
      transition: transform 0.1s;
    }
    .start-btn.advanced {
      background: linear-gradient(180deg, #e91e63, #ad1457);
      box-shadow: 0 5px 0 #880e4f;
    }
    .start-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #bf360c;
    }
    .hide {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="score-board">
      得分: <span id="scoreText">0</span>
      <span id="modeTag" style="font-size: 14px; margin-left: 6px; color: #b0bec5; font-weight: normal;"></span>
    </div>
    <div class="timer-board">⏱ <span id="timeText">60</span>s</div>
    <div class="lives-board" id="livesText">❤❤❤</div>
  </div>

  <!-- 開始 / 規則彈窗 -->
  <div id="startModal" class="modal-overlay">
    <div class="modal-card">
      <h2>🍉 質數合數切切樂 🍉</h2>
      <div class="rules-list">
        <ul>
          <li>⚠️ <b>水果外觀完全相同，請專注認清上面的數字！</b></li>
          <li>🔪 <b>合數（可分解）</b>：滑動手指<b>切開它</b> (+10分)！</li>
          <li>💣 <b>質數（不可分）</b>：<b>千萬別切</b>！切到扣 1 命且<b>全場定格 2 秒</b>。</li>
          <li>⭐ <b>數字「1」</b>：既非質數也非合數，切到<b>延長時間 +5 秒</b>！</li>
          <li>⏳ 共有 3 條命，限時 60 秒！請選擇挑戰難度：</li>
        </ul>
      </div>
      <div class="mode-select-title">選擇挑戰模式</div>
      <div class="btn-group">
        <button class="start-btn" onclick="startGame(50)">🌱 基礎模式 (1~50)</button>
        <button class="start-btn advanced" onclick="startGame(100)">🔥 進階模式 (1~100)</button>
      </div>
    </div>
  </div>

  <!-- 結束面板 -->
  <div id="endModal" class="modal-overlay hide">
    <div class="modal-card">
      <h2 id="endTitle">遊戲結束</h2>
      <p style="font-size: 20px; color: #4e342e; margin: 15px 0;">最終得分：<b id="finalScore" style="color: #e65100; font-size: 34px;">0</b></p>
      <div class="btn-group">
        <button class="start-btn" onclick="startGame(50)">🌱 再玩一次 (1~50)</button>
        <button class="start-btn advanced" onclick="startGame(100)">🔥 挑戰進階 (1~100)</button>
      </div>
    </div>
  </div>
</div>

<script>
  // 音效系統 (Web Audio API)
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx = null;

  function initAudio() {
    if (!actx) actx = new AudioCtx();
    if (actx.state === 'suspended') actx.resume();
  }

  function playSound(type) {
    if (!actx) return;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.connect(gain);
    gain.connect(actx.destination);
    const now = actx.currentTime;

    if (type === 'slice') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'bomb') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.linearRampToValueAtTime(25, now + 0.45);
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.45);
      osc.start(now);
      osc.stop(now + 0.45);
    } else if (type === 'bonus') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.08);
      osc.frequency.setValueAtTime(783.99, now + 0.16);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    }
  }

  // 質數判斷
  function checkPrime(n) {
    if (n <= 1) return false;
    for (let i = 2; i * i <= n; i++) {
      if (n % i === 0) return false;
    }
    return true;
  }

  // 畫布與狀態
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreText = document.getElementById('scoreText');
  const timeText = document.getElementById('timeText');
  const livesText = document.getElementById('livesText');
  const modeTag = document.getElementById('modeTag');
  const startModal = document.getElementById('startModal');
  const endModal = document.getElementById('endModal');
  const finalScore = document.getElementById('finalScore');
  const endTitle = document.getElementById('endTitle');

  let width, height;
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let gameState = 'START'; // START, PLAYING, GAMEOVER
  let score = 0;
  let lives = 3;
  let timeLeft = 60;
  let timerInterval = null;
  let maxNumber = 50;

  // 定格暫停與特殊提示機制變數
  let pauseUntil = 0; // 暫停結束時間戳
  let pausePrimeVal = 0;
  let bonusNoticeUntil = 0; // 1 的提示顯示結束時間戳

  let targets = [];
  let particles = [];
  let slashTrail = [];

  const FRUIT_SKINS = [
    { outer: '#1b5e20', inner: '#d32f2f' }, // 西瓜
    { outer: '#e65100', inner: '#ff9800' }, // 橘子
    { outer: '#f57f17', inner: '#ffeb3b' }, // 檸檬
    { outer: '#4a148c', inner: '#8e24aa' }, // 葡萄
    { outer: '#33691e', inner: '#8bc34a' }  // 青蘋果
  ];

  class Target {
    constructor() {
      this.radius = 46;
      this.x = width * 0.15 + Math.random() * (width * 0.7);
      this.y = height + this.radius;
      this.vx = (Math.random() - 0.5) * 3;
      this.vy = -(10 + Math.random() * 3.5);
      this.gravity = 0.16;
      this.rotation = 0;
      this.vRot = (Math.random() - 0.5) * 0.04;
      this.isSliced = false;

      this.skin = FRUIT_SKINS[Math.floor(Math.random() * FRUIT_SKINS.length)];

      const rand = Math.random();
      if (rand < 0.08) {
        this.value = 1;
        this.type = 'SPECIAL'; // 既非質數也非合數
      } else {
        this.value = Math.floor(Math.random() * (maxNumber - 1)) + 2;
        this.type = checkPrime(this.value) ? 'PRIME' : 'COMPOSITE';
      }
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += this.gravity;
      this.rotation += this.vRot;
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);

      // 外皮
      ctx.fillStyle = this.skin.outer;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      ctx.fill();

      // 果肉
      ctx.fillStyle = this.skin.inner;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius - 6, 0, Math.PI * 2);
      ctx.fill();

      // 微高光
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(0, 0, this.radius - 8, -Math.PI * 0.6, -Math.PI * 0.1);
      ctx.stroke();

      // 數字標籤
      ctx.fillStyle = '#ffffff';
      const fontSize = this.value >= 100 ? 32 : 36;
      ctx.font = `900 ${fontSize}px Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
      ctx.shadowBlur = 8;
      ctx.fillText(this.value, 0, 0);

      ctx.restore();
    }
  }

  // 粒子特效
  class Particle {
    constructor(x, y, vx, vy, color, text = null, fontSize = 24) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.color = color;
      this.text = text;
      this.fontSize = fontSize;
      this.alpha = 1;
      this.size = 8 + Math.random() * 8;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += 0.2;
      this.alpha -= 0.02;
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.alpha);
      if (this.text) {
        ctx.fillStyle = this.color;
        ctx.font = `bold ${this.fontSize}px Arial`;
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.85)';
        ctx.shadowBlur = 6;
        ctx.fillText(this.text, this.x, this.y);
      } else {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function createSplash(x, y, color, count = 14) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 8;
      particles.push(new Particle(
        x, y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        color
      ));
    }
  }

  // 切割線段碰撞檢測
  function checkLineCircleIntersection(p1, p2, circle) {
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const len = Math.hypot(dx, dy);
    if (len === 0) return false;
    const u = ((circle.x - p1.x) * dx + (circle.y - p1.y) * dy) / (len * len);
    const clampedU = Math.max(0, Math.min(1, u));
    const nx = p1.x + clampedU * dx;
    const ny = p1.y + clampedU * dy;
    return Math.hypot(circle.x - nx, circle.y - ny) <= circle.radius;
  }

  let isPointerDown = false;

  function addTrailPoint(x, y) {
    // 若在暫停定格狀態，忽略任何滑動判定
    if (gameState !== 'PLAYING' || Date.now() < pauseUntil) return;

    slashTrail.push({ x, y, time: Date.now() });
    if (slashTrail.length > 1) {
      const p1 = slashTrail[slashTrail.length - 2];
      const p2 = slashTrail[slashTrail.length - 1];

      targets.forEach(target => {
        if (!target.isSliced && checkLineCircleIntersection(p1, p2, target)) {
          sliceTarget(target);
        }
      });
    }
  }

  // 切中目標
  function sliceTarget(target) {
    target.isSliced = true;

    if (target.type === 'COMPOSITE') {
      // 合數
      score += 10;
      scoreText.textContent = score;
      playSound('slice');
      createSplash(target.x, target.y, target.skin.inner);
      particles.push(new Particle(target.x, target.y - 20, 0, -2, '#76ff03', '+10 合數！', 26));
    } else if (target.type === 'PRIME') {
      // 質數：切錯扣命並觸發 2 秒定格思考
      lives--;
      updateLivesDisplay();
      playSound('bomb');
      createSplash(target.x, target.y, '#ff1744', 30);

      if (lives <= 0) {
        gameOver('生命用盡！');
      } else {
        // 設定定格暫停 2000 毫秒
        pauseUntil = Date.now() + 2000;
        pausePrimeVal = target.value;
      }
    } else if (target.type === 'SPECIAL') {
      // 1：觸發加時並開啟 1.8 秒 Canvas 醒目橫幅
      timeLeft += 5;
      timeText.textContent = timeLeft;
      playSound('bonus');
      createSplash(target.x, target.y, '#ffeb3b', 26);
      bonusNoticeUntil = Date.now() + 1800;
    }
  }

  function updateLivesDisplay() {
    livesText.textContent = '❤'.repeat(Math.max(0, lives));
  }

  // 操作監聽
  window.addEventListener('touchstart', (e) => {
    initAudio();
    isPointerDown = true;
    slashTrail = [];
    const t = e.touches[0];
    addTrailPoint(t.clientX, t.clientY);
  });
  window.addEventListener('touchmove', (e) => {
    if (!isPointerDown) return;
    const t = e.touches[0];
    addTrailPoint(t.clientX, t.clientY);
  });
  window.addEventListener('touchend', () => { isPointerDown = false; });

  window.addEventListener('mousedown', (e) => {
    initAudio();
    isPointerDown = true;
    slashTrail = [];
    addTrailPoint(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    if (!isPointerDown) return;
    addTrailPoint(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', () => { isPointerDown = false; });

  // 生成水果
  let spawnTimer = 0;
  function updateSpawning() {
    spawnTimer++;
    if (spawnTimer % 85 === 0) {
      const batchCount = 1 + Math.floor(Math.random() * 2);
      for (let i = 0; i < batchCount; i++) {
        targets.push(new Target());
      }
    }
  }

  // 繪製圓角矩形輔助函數
  function drawRoundedRect(cx, x, y, w, h, r) {
    cx.beginPath();
    cx.moveTo(x + r, y);
    cx.lineTo(x + w - r, y);
    cx.quadraticCurveTo(x + w, y, x + w, y + r);
    cx.lineTo(x + w, y + h - r);
    cx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    cx.lineTo(x + r, y + h);
    cx.quadraticCurveTo(x, y + h, x, y + h - r);
    cx.lineTo(x, y + r);
    cx.quadraticCurveTo(x, y, x + r, y);
    cx.closePath();
  }

  // 主迴圈
  function loop() {
    ctx.clearRect(0, 0, width, height);

    if (gameState === 'PLAYING') {
      const isPaused = Date.now() < pauseUntil;

      // 如果沒有在暫停狀態，才更新位置與生成新水果
      if (!isPaused) {
        updateSpawning();

        for (let i = targets.length - 1; i >= 0; i--) {
          const t = targets[i];
          t.update();
          t.draw();
          if (t.isSliced || t.y > height + 100) {
            targets.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update();
          p.draw();
          if (p.alpha <= 0) particles.splice(i, 1);
        }
      } else {
        // 定格狀態：水果與粒子維持原樣繪製
        targets.forEach(t => t.draw());
        particles.forEach(p => p.draw());
      }

      // --- 繪製切到 1 的醒目橫幅 (直接畫在 Canvas 上) ---
      if (Date.now() < bonusNoticeUntil) {
        ctx.save();
        const bannerW = Math.min(width * 0.9, 520);
        const bannerH = 64;
        const bannerX = (width - bannerW) / 2;
        const bannerY = height * 0.25;

        // 金黃色背景與光暈
        ctx.shadowColor = 'rgba(255, 215, 0, 0.9)';
        ctx.shadowBlur = 25;
        ctx.fillStyle = 'rgba(255, 193, 7, 0.95)';
        drawRoundedRect(ctx, bannerX, bannerY, bannerW, bannerH, 32);
        ctx.fill();

        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#3e2723';
        ctx.font = 'bold 22px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✨ 1 既非質數，也非合數！時間 +5 秒 ✨', width / 2, bannerY + bannerH / 2);
        ctx.restore();
      }

      // --- 繪製切錯 2 秒定格思考卡 (直接畫在 Canvas 上) ---
      if (isPaused) {
        ctx.save();
        // 背景暗幕
        ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.fillRect(0, 0, width, height);

        const cardW = Math.min(width * 0.88, 480);
        const cardH = 200;
        const cardX = (width - cardW) / 2;
        const cardY = (height - cardH) / 2;

        // 紅色外框卡片
        ctx.fillStyle = 'rgba(33, 33, 33, 0.96)';
        ctx.shadowColor = 'rgba(255, 23, 68, 0.8)';
        ctx.shadowBlur = 30;
        drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 20);
        ctx.fill();

        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ff5252';
        ctx.stroke();

        ctx.shadowBlur = 0;
        // 標題
        ctx.fillStyle = '#ff5252';
        ctx.font = 'bold 26px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⚠️ 切錯了！切到了質數', width / 2, cardY + 45);

        // 教學內容
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px Arial, sans-serif';
        ctx.fillText(`【 ${pausePrimeVal} 】是質數！`, width / 2, cardY + 90);

        ctx.fillStyle = '#ffebee';
        ctx.font = '16px Arial, sans-serif';
        ctx.fillText(`因數只有 1 和 ${pausePrimeVal}，不可再分！`, width / 2, cardY + 125);

        // 倒數進度條
        const remainRatio = Math.max(0, (pauseUntil - Date.now()) / 2000);
        const barW = cardW - 60;
        const barH = 8;
        const barX = cardX + 30;
        const barY = cardY + 155;

        ctx.fillStyle = '#424242';
        drawRoundedRect(ctx, barX, barY, barW, barH, 4);
        ctx.fill();

        ctx.fillStyle = '#ff5252';
        drawRoundedRect(ctx, barX, barY, barW * remainRatio, barH, 4);
        ctx.fill();

        ctx.restore();
      }

      // 繪製滑動切刀軌跡
      const now = Date.now();
      slashTrail = slashTrail.filter(pt => now - pt.time < 150);
      if (slashTrail.length > 1) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(slashTrail[0].x, slashTrail[0].y);
        for (let i = 1; i < slashTrail.length; i++) {
          ctx.lineTo(slashTrail[i].x, slashTrail[i].y);
        }
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.restore();
      }
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // 遊戲啟動函數
  function startGame(limit) {
    initAudio();
    maxNumber = limit;
    modeTag.textContent = limit === 50 ? '[基礎 1~50]' : '[進階 1~100]';

    score = 0;
    lives = 3;
    timeLeft = 60;
    pauseUntil = 0;
    bonusNoticeUntil = 0;
    targets = [];
    particles = [];
    slashTrail = [];

    scoreText.textContent = score;
    timeText.textContent = timeLeft;
    updateLivesDisplay();

    startModal.classList.add('hide');
    endModal.classList.add('hide');
    gameState = 'PLAYING';

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      // 只有在非定格狀態下才扣倒數時間
      if (gameState === 'PLAYING' && Date.now() >= pauseUntil) {
        timeLeft--;
        timeText.textContent = timeLeft;
        if (timeLeft <= 0) {
          gameOver('時間到！');
        }
      }
    }, 1000);
  }

  function gameOver(title) {
    gameState = 'GAMEOVER';
    clearInterval(timerInterval);
    endTitle.textContent = title;
    finalScore.textContent = score;
    endModal.classList.remove('hide');
  }
</script>
</body>
</html>
